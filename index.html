<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#08080a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Treino" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Treino</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bg: {
                0: '#08080a',
                1: '#0f0f12',
                2: '#17171c',
                3: '#1f1f26',
              },
              text: {
                0: '#ffffff',
                1: '#d4d4d8',
                2: '#8b8b95',
                3: '#52525b',
              },
              accent: {
                DEFAULT: '#22d3a8',
                hover: '#34e5ba',
                dim: 'rgba(34, 211, 168, 0.12)',
              },
              danger: '#f87171',
              warn: '#fbbf24',
              info: '#60a5fa',
              purple: '#a78bfa',
            },
            fontFamily: {
              sans: [
                '-apple-system',
                'BlinkMacSystemFont',
                'SF Pro Display',
                'Inter',
                'system-ui',
                'sans-serif',
              ],
            },
            borderRadius: {
              xl: '0.75rem',
              '2xl': '1rem',
              '3xl': '1.5rem',
            },
            boxShadow: {
              'glow-accent':
                '0 0 0 1px rgba(34, 211, 168, 0.2), 0 8px 24px -8px rgba(34, 211, 168, 0.3)',
              'card-sm': '0 2px 8px rgba(0, 0, 0, 0.3)',
              'card-md': '0 4px 16px rgba(0, 0, 0, 0.4)',
              'card-lg': '0 12px 32px rgba(0, 0, 0, 0.5)',
              'inset-hi': 'inset 0 1px 0 rgba(255, 255, 255, 0.06)',
            },
            animation: {
              'fade-in': 'fadeIn 0.2s ease-out',
              'slide-up': 'slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1)',
              'scale-in': 'scaleIn 0.15s ease-out',
              'pulse-soft': 'pulseSoft 2s ease-in-out infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { opacity: '0', transform: 'translateY(8px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              scaleIn: {
                '0%': { opacity: '0', transform: 'scale(0.96)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              pulseSoft: {
                '0%, 100%': { opacity: '0.6' },
                '50%': { opacity: '1' },
              },
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-bg-0 text-text-1 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
