<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#050810" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Treino" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Fontes: Space Grotesk (dados) + JetBrains Mono (labels) + Inter (corpo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Treino</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // ── Fundo profundo azul-carvão ──
              bg: {
                0: '#050810',
                1: '#0a1020',
                2: '#101828',
                3: '#18233a',
              },
              // ── Texto ──
              text: {
                0: '#f0f6ff',
                1: '#cbd5e1',
                2: '#94a3b8',
                3: '#475569',
              },
              // ── Accent principal (cyan) ──
              accent: {
                DEFAULT: '#06b6d4',
                hover: '#22d3ee',
                dim: 'rgba(6, 182, 212, 0.12)',
                glow: 'rgba(6, 182, 212, 0.35)',
              },
              // ── Semânticas ──
              danger: '#ef4444',
              warn: '#f97316',
              success: '#10b981',
              info: '#60a5fa',
              sci: '#a78bfa', // roxo científico
              pr: '#f97316', // laranja PR
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              display: ['"Space Grotesk"', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            borderRadius: {
              xl: '0.875rem',
              '2xl': '1.125rem',
              '3xl': '1.5rem',
              '4xl': '2rem',
            },
            boxShadow: {
              'glow-accent':
                '0 0 0 1px rgba(6, 182, 212, 0.25), 0 8px 32px -8px rgba(6, 182, 212, 0.45)',
              'glow-pr':
                '0 0 0 1px rgba(249, 115, 22, 0.25), 0 8px 32px -8px rgba(249, 115, 22, 0.45)',
              'card': '0 4px 24px rgba(0, 0, 0, 0.45)',
              'card-lg': '0 12px 48px rgba(0, 0, 0, 0.55)',
              'inset-hi': 'inset 0 1px 0 rgba(255, 255, 255, 0.06)',
              'punch': '0 0 0 0 rgba(6, 182, 212, 0.7)',
            },
            animation: {
              'fade-in': 'fadeIn 0.25s ease-out',
              'slide-up': 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
              'scale-in': 'scaleIn 0.2s ease-out',
              'pulse-soft': 'pulseSoft 2.4s ease-in-out infinite',
              'pulse-glow': 'pulseGlow 2s ease-in-out infinite',
              'punch': 'punch 0.5s cubic-bezier(0.16, 1, 0.3, 1)',
              'shimmer': 'shimmer 2.5s linear infinite',
              'float': 'float 6s ease-in-out infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              scaleIn: {
                '0%': { opacity: '0', transform: 'scale(0.94)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              pulseSoft: {
                '0%, 100%': { opacity: '0.55' },
                '50%': { opacity: '1' },
              },
              pulseGlow: {
                '0%, 100%': {
                  boxShadow:
                    '0 0 0 0 rgba(6, 182, 212, 0.4), 0 0 20px -4px rgba(6, 182, 212, 0.5)',
                },
                '50%': {
                  boxShadow:
                    '0 0 0 8px rgba(6, 182, 212, 0), 0 0 30px -4px rgba(6, 182, 212, 0.7)',
                },
              },
              punch: {
                '0%': {
                  boxShadow: '0 0 0 0 rgba(6, 182, 212, 0.8)',
                  transform: 'scale(1)',
                },
                '50%': {
                  boxShadow: '0 0 0 14px rgba(6, 182, 212, 0)',
                  transform: 'scale(1.08)',
                },
                '100%': {
                  boxShadow: '0 0 0 0 rgba(6, 182, 212, 0)',
                  transform: 'scale(1)',
                },
              },
              shimmer: {
                '0%': { backgroundPosition: '-200% 0' },
                '100%': { backgroundPosition: '200% 0' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-4px)' },
              },
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-bg-0 text-text-1 font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
